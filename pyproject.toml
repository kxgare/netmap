[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netmap-desktop"
version = "0.3.0"
description = "Локальный монитор сетевых соединений с интерактивной картой"
requires-python = ">=3.12"
dependencies = ["PySide6==6.10.2", "psutil==7.2.2", "geoip2==5.2.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pyinstaller==6.19.0"]

[project.gui-scripts]
netmap = "netmap.__main__:main"

[tool.setuptools.packages.find]
include = ["netmap*"]

[tool.setuptools.package-data]
netmap = ["resources/*.svg", "resources/*.ico", "resources/map/*", "resources/map/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
